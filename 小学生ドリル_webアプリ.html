const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const frac = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const mixed = (w, n, d) => `<span class="mixed">${w}</span>${frac(n, d)}`;

// ===== おと =====
let soundOn = true, audio = null;
function beep(seq) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    let t = audio.currentTime;
    for (const [f, d] of seq) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + d); t += d;
    }
  } catch (e) {}

function distractors(pool, w, idx, n = 3) {
  // 文字数の近いものを優先してえらぶ
  const key = w[idx];
  return shuffle(pool.filter(x => x[idx] !== key))
    .sort((a, b) => Math.abs(a[idx].length - key.length) - Math.abs(b[idx].length - key.length) + (Math.random() - .5))
    .slice(0, n).map(x => x[idx]);
}
function yomiQ(w, pool) {
  return { kind: 'choice', label: 'この かんじの よみかたは？', big: w[0], answer: w[1], answerText: w[1],
           choices: shuffle([w[1], ...distractors(pool, w, 1)]) };
}
function kakiQ(w, pool) {
  return { kind: 'choice', label: 'ひらがなを かんじで かくと？', big: w[1], answer: w[0], answerText: w[0],
           choices: shuffle([w[0], ...distractors(pool, w, 0)]) };
}

// ===== けいさん問題 =====
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
function num(html, answers, o = {}) {
  return { kind: 'input', label: o.label || 'けいさんしよう', html, fields: answers.map(a => ({ ans: a })),
           answerText: o.answerText || answers.join(' あまり '), explain: o.explain || '' };
}
function coprimePair(lo, hi) {
  for (;;) { const p = rnd(lo, hi), q = rnd(lo, hi); if (p !== q && gcd(p, q) === 1) return [p, q]; }
}
// 小数のたし算・ひき算（scale=10 なら小数第1位）
function decAddSub(scale, lo, hi, addOnly) {
  const digits = scale === 100 ? 2 : 1;
  let A = rnd(lo, hi), B = rnd(lo, hi);
  const add = addOnly || Math.random() < .5;
  if (!add && A < B) [A, B] = [B, A];
  if (!add && A === B) A++;
  const f = x => (x / scale).toFixed(digits), res = add ? A + B : A - B;
  return num(`${f(A)} ${add ? '+' : '−'} ${f(B)} = {0}`, [res / scale], { answerText: f(res) });
}
// 同じ分母の分数のたし算（g4 でも g3 でも使う）
function fracAdd(dv, a, b, label) {
  return num(`${frac(a, dv)} + ${frac(b, dv)} = ${frac('{0}', dv)}`, [a + b], { answerText: frac(a + b, dv), label });
}

function calcQ(grade, type, diff) {
  const C = CALC[grade];
  if (type === 'all') type = pick(C.types.slice(1).map(t => t[0]));
  return C.gen[type](diff);
}

// ===== 設定・成績 =====
const DIFFS = ['かんたん', 'ふつう', 'むずかしい'];
let cfg = { grade: 4, mode: 'yomi', calc: 'all', diff: 1 };
let stats = { best: {} };
try { const s = JSON.parse(localStorage.getItem('kdrill-v2')); if (s && s.best) stats = s; } catch (e) {}
try { const c = JSON.parse(localStorage.getItem('kdrill-cfg')); if (c && CALC[c.grade]) cfg = Object.assign(cfg, c); } catch (e) {}
function saveStats() { try { localStorage.setItem('kdrill-v2', JSON.stringify(stats)); } catch (e) {} }
function saveCfg() { try { localStorage.setItem('kdrill-cfg', JSON.stringify(cfg)); } catch (e) {} }
const keyFor = c => (c.mode === 'yomi' || c.mode === 'kaki') ? `${c.grade}:${c.mode}` : `${c.grade}:${c.mode}:${c.calc}:${c.diff}`;

function buildQuestions(c) {
  const pool = KANJI[c.grade], ws = shuffle(pool), N = 10;
  const calc = () => calcQ(c.grade, c.calc, c.diff);
  if (c.mode === 'yomi') return ws.slice(0, N).map(w => yomiQ(w, pool));
  if (c.mode === 'kaki') return ws.slice(0, N).map(w => kakiQ(w, pool));
  if (c.mode === 'calc') return Array.from({ length: N }, calc);
  return shuffle([
    ...ws.slice(0, 4).map(w => yomiQ(w, pool)), ...ws.slice(4, 7).map(w => kakiQ(w, pool)),
    ...Array.from({ length: 3 }, calc)
  ]);
}

// ===== がめん: 問題 =====
function start(qs) { S = { qs, i: 0, results: [], answered: false }; renderQuiz(); }

function inputHtml(n) { return `<input class="ans" data-n="${n}" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="こたえ">`; }

function renderQuiz() {
  const q = S.qs[S.i], right = S.results.filter(r => r.ok).length;
  S.answered = false;
  app.innerHTML = `
    <div class="top"><button class="ghost" data-act="home">← やめる</button><span>${S.i + 1} / ${S.qs.length}</span><span>⭕ ${right}</span></div>
    <div class="bar"><i style="width:${S.i / S.qs.length * 100}%"></i></div>
    <div class="card">
      <div class="label">${q.label}</div>
      ${q.big ? `<div class="big">${q.big}</div>` : ''}
      ${q.html ? `<div class="prob">${q.html.replace(/\{(\d)\}/g, (m, n) => inputHtml(n))}</div>` : ''}
      ${q.kind === 'choice'
        ? `<div class="choices">${q.choices.map((c, i) => `<button class="choice" data-choice="${i}">${c}</button>`).join('')}</div>`
        : `<div class="hint" id="hint"></div><button class="next" data-act="submit">こたえる</button>`}
      <div id="fb"></div>
    </div>`;
  const first = app.querySelector('input.ans'); if (first) first.focus();
}

function finishAnswer(ok, userInfo) {
  const q = S.qs[S.i];
  S.answered = true; S.results.push({ q, ok });
  (ok ? soundOK : soundNG)();
  const last = S.i === S.qs.length - 1;
  const submit = app.querySelector('[data-act="submit"]'); if (submit) submit.remove();
  const hint = document.getElementById('hint'); if (hint) hint.remove();
  document.getElementById('fb').innerHTML = `
    <div class="fb ${ok ? 'ok' : 'ng'}">${ok ? '⭕ せいかい！' : `❌ ざんねん… こたえは <b>${q.answerText}</b>`}
      ${q.explain && !ok ? `<div class="sub">${q.explain}</div>` : ''}</div>
    <button class="next" data-act="next">${last ? 'けっかを みる ▶' : 'つぎへ ▶'}</button>`;
  const nx = app.querySelector('[data-act="next"]'); if (nx) nx.focus({ preventScroll: true });
}

function answerChoice(i) {
  const q = S.qs[S.i]; if (S.answered) return;
  const btns = [...app.querySelectorAll('.choice')];
  const ok = q.choices[i] === q.answer;
  btns.forEach((b, k) => { b.disabled = true; if (q.choices[k] === q.answer) b.classList.add('ok'); });
  if (!ok) btns[i].classList.add('ng');
  finishAnswer(ok);
}

const norm = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[．。]/g, '.').trim();
function answerInput() {
  const q = S.qs[S.i]; if (S.answered) return;
  const ins = [...app.querySelectorAll('input.ans')];
  const vals = ins.map(el => norm(el.value));
  if (vals.some(v => v === '' || isNaN(Number(v)))) {
    document.getElementById('hint').textContent = 'すうじで こたえを いれてね';
    const card = app.querySelector('.card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    (ins.find((el, i) => vals[i] === '' || isNaN(Number(vals[i]))) || ins[0]).focus();
    return;
  }
  let ok = true;
  ins.forEach((el, i) => {
    const good = Math.abs(Number(vals[i]) - q.fields[i].ans) < 1e-9;
    el.disabled = true; el.classList.add(good ? 'ok' : 'ng'); if (!good) ok = false;
  });
  finishAnswer(ok);
}

function next() {
  if (S.i < S.qs.length - 1) { S.i++; renderQuiz(); } else renderResult();
}

    <h1>けっか</h1>
    <div class="card">
      <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <div class="score">${score} / ${total}</div>
      <div class="msg">${msg}${isBest && score > 0 ? '<br>🎉 ベストこうしん！' : ''}</div>
      ${wrong.length ? `<h2>まちがえた もんだい</h2>${wrong.map(r => `<div class="wrong">${
        r.q.kind === 'choice' ? `${r.q.big} → <b>${r.q.answerText}</b>` : `${r.q.html.replace(/\{(\d)\}/g, '□')} → <b>${r.q.answerText}</b>`}</div>`).join('')}` : ''}
      <button class="start" data-act="again">もういちど（あたらしい もんだい）</button>
      ${wrong.length ? `<button class="start" style="background:#8ecae6;box-shadow:0 4px 0 #5aa2c4" data-act="review">まちがえた もんだいだけ やりなおす</button>` : ''}
      <button class="start" style="background:#e9e9f5;box-shadow:0 4px 0 #c5c5dc;font-size:18px" data-act="home">ホームへ</button>
    </div>`;
}

// ===== イベント =====
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.grade) { cfg.grade = +d.grade; cfg.calc = 'all'; saveCfg(); renderHome(); }
  else if (d.mode) { cfg.mode = d.mode; saveCfg(); renderHome(); }
  else if (d.calc) { cfg.calc = d.calc; saveCfg(); renderHome(); }
  else if (d.diff) { cfg.diff = +d.diff; saveCfg(); renderHome(); }
  else if (d.choice !== undefined) answerChoice(+d.choice);
  else if (d.act === 'start' || d.act === 'again') start(buildQuestions(cfg));
  else if (d.act === 'review') start(S.results.filter(r => !r.ok).map(r => r.q));
  else if (d.act === 'submit') answerInput();
  else if (d.act === 'next') next();
  else if (d.act === 'home') renderHome();
  else if (d.act === 'sound') { soundOn = !soundOn; renderHome(); }
});
app.addEventListener('focusin', e => {
  if (e.target.classList && e.target.classList.contains('ans')) {
    const b = app.querySelector('[data-act="submit"]');
    if (b) setTimeout(() => b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 300);
  }
});
window.addEventListener('keydown', e => {
  if (!S || e.repeat) return;
  const q = S.qs[S.i]; if (!q || document.querySelector('h1')) return;
  if (e.key === 'Enter') {
    if (S.answered) { e.preventDefault(); next(); }
    else if (q.kind === 'input') { e.preventDefault(); answerInput(); }
  } else if (q.kind === 'choice' && !S.answered && /^[1-4]$/.test(e.key)) {
    answerChoice(+e.key - 1);
  }
});

renderHome();
</script>
</body>
</html>
